# Paquetes de Linux (AppImage, .deb y .rpm) para x64 y ARM64. Se ejecuta a mano desde la pestaña
# Actions o desde pr-release.yml en cada PR a main. Cada paquete queda como un artefacto propio.
name: Build Linux

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Versión de la app para los instaladores (p. ej. 0.2.0). Vacío = la de package.json.
        type: string
        default: ''
      ref:
        description: Commit a compilar. Vacío = el del evento.
        type: string
        default: ''

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Compilación nativa en cada arquitectura (fetch-binaries puede ejecutar yt-dlp para leer su versión).
    runs-on: ${{ matrix.runner }}
    env:
      # El fpm que descarga electron-builder es solo x86_64: se usa el del sistema en ambas arquitecturas.
      USE_SYSTEM_FPM: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # rpm aporta rpmbuild; ruby + fpm generan el .deb y el .rpm.
      - name: Herramientas de empaquetado
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev build-essential
          sudo gem install fpm --no-document
      - run: npm ci
      # Los instaladores llevan la versión del release (p. ej. Descargador-0.2.0-arm64.dmg).
      - name: Versión ${{ inputs.version }}
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm test
      - name: Build paquetes ${{ matrix.arch }}
        run: npm run build:linux:${{ matrix.arch }}
      # Un artefacto por paquete. Ya van comprimidos, no se recomprimen.
      - uses: actions/upload-artifact@v4
        with:
          name: Descargador-Linux-${{ matrix.arch }}-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Descargador-Linux-${{ matrix.arch }}-deb
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Descargador-Linux-${{ matrix.arch }}-rpm
          path: dist/*.rpm
          if-no-files-found: error
          compression-level: 0
