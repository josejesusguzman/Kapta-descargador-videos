# Instaladores de macOS (DMG para Apple Silicon e Intel). Se ejecuta a mano desde la pestaña
# Actions o al publicar un tag v*. Cada DMG queda como un artefacto propio de la ejecución.
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build DMG (arm64 + x64)
        run: npm run build:mac
        env:
          # Sin certificado: firma ad-hoc (ver electron-builder.yml). Para firmar y notarizar,
          # agregar los secrets CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y
          # APPLE_TEAM_ID, pasarlos aquí y quitar esta variable.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Un artefacto por arquitectura: arm64 = Apple Silicon (M1 en adelante), x64 = Intel.
      - uses: actions/upload-artifact@v4
        with:
          name: Descargador-macOS-arm64
          path: dist/*-arm64.dmg
          if-no-files-found: error
          # El instalador ya va comprimido.
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Descargador-macOS-x64
          path: dist/*-x64.dmg
          if-no-files-found: error
          # El instalador ya va comprimido.
          compression-level: 0
