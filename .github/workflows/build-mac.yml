# Instaladores de macOS (DMG para Apple Silicon e Intel). Se ejecuta a mano desde la pestaña Actions o
# desde pr-release.yml en cada PR a main. Cada DMG queda como un artefacto propio de la ejecución.
name: Build macOS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Versión de la app para los instaladores (p. ej. 0.2.0). Vacío = la de package.json.
        type: string
        default: ''
      ref:
        description: Commit a compilar. Vacío = el del evento.
        type: string
        default: ''

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los instaladores llevan la versión del release (p. ej. macOS-Kapta-Descargador-0.3.0-arm64.dmg).
      - name: Versión ${{ inputs.version }}
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm test
      - name: Build DMG (arm64 + x64)
        run: npm run build:mac
        env:
          # Sin certificado: firma ad-hoc (ver electron-builder.yml). Para firmar y notarizar,
          # agregar los secrets CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD y
          # APPLE_TEAM_ID, pasarlos aquí y quitar esta variable.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Un artefacto por arquitectura: arm64 = Apple Silicon (M1 en adelante), x64 = Intel.
      - uses: actions/upload-artifact@v4
        with:
          name: Kapta-Descargador-macOS-arm64
          path: dist/*-arm64.dmg
          if-no-files-found: error
          # El instalador ya va comprimido.
          compression-level: 0
          # Al re-ejecutar un job, reemplaza el artefacto anterior en vez de fallar.
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: Kapta-Descargador-macOS-x64
          path: dist/*-x64.dmg
          if-no-files-found: error
          # El instalador ya va comprimido.
          compression-level: 0
          # Al re-ejecutar un job, reemplaza el artefacto anterior en vez de fallar.
          overwrite: true
