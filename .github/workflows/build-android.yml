# APK de Android (arm64 y armv7). Se ejecuta a mano desde la pestaña Actions o desde pr-release.yml en cada PR a main.
# Cada APK queda como un artefacto propio.
#
# Firma: secrets ANDROID_KEYSTORE_BASE64 (el .jks en base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
# ANDROID_KEY_PASSWORD (ver README → Distribución → Android). Sin ellos se firma con una llave de depuración, que sirve
# para probar pero no para actualizar la app instalada; por eso un release publicado exige la llave real.
name: Build Android

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Versión de la app para los APK (p. ej. 0.2.0). Vacío = la de package.json.
        type: string
        default: ''
      ref:
        description: Commit a compilar. Vacío = el del evento.
        type: string
        default: ''
      require-signing:
        description: Fallar si no está la llave de firma (los APK se van a publicar).
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci
      # Los APK llevan la versión del release (p. ej. Android-Kapta-Descargador-0.3.0-arm64.apk); Gradle la lee de package.json.
      - name: Versión ${{ inputs.version }}
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm test
      - name: Llave de firma
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE: ${{ inputs.require-signing }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            if [ "$REQUIRE" = true ]; then
              echo "::error::Faltan los secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD y ANDROID_KEY_ALIAS (y ANDROID_KEY_PASSWORD si es distinta). Ver README → Distribución → Android."
              exit 1
            fi
            echo "::warning::Sin llave de firma: los APK se firman con una llave de depuración (solo para probar)."
            exit 0
          fi
          keystore="$RUNNER_TEMP/kapta-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "KAPTA_KEYSTORE=$keystore"
            echo "KAPTA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KAPTA_KEY_ALIAS=$KEY_ALIAS"
            echo "KAPTA_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      # Typecheck, interfaz (out/mobile), cap sync, pruebas de la JVM y APK de release.
      - name: Build APK
        run: npm run build:android
      - name: Comprobar firma
        shell: bash
        run: |
          ls -l android/app/build/outputs/apk/release
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          for apk in android/app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -m1 'certificate DN'
          done
      # Un artefacto por APK. Ya van comprimidos, no se recomprimen.
      - uses: actions/upload-artifact@v4
        with:
          name: Kapta-Descargador-Android-arm64
          path: android/app/build/outputs/apk/release/*-arm64.apk
          if-no-files-found: error
          compression-level: 0
          # Al re-ejecutar un job, reemplaza el artefacto anterior en vez de fallar.
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: Kapta-Descargador-Android-armv7
          path: android/app/build/outputs/apk/release/*-armv7.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
