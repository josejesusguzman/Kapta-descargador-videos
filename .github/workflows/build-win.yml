# Instaladores de Windows (NSIS por usuario para x64 y ARM64). Se ejecuta a mano desde la pestaña
# Actions o desde pr-release.yml en cada PR a main. Cada instalador queda como un artefacto propio.
name: Build Windows

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Versión de la app para los instaladores (p. ej. 0.2.0). Vacío = la de package.json.
        type: string
        default: ''
      ref:
        description: Commit a compilar. Vacío = el del evento.
        type: string
        default: ''

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los instaladores llevan la versión del release (p. ej. Windows-Kapta-Descargador-Setup-0.3.0-x64.exe).
      - name: Versión ${{ inputs.version }}
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm test
      # El runner es x64: el instalador ARM64 se genera de forma cruzada (fetch-binaries toma la
      # versión de yt-dlp del último release al no poder ejecutar yt-dlp_arm64.exe).
      - name: Build instalador x64
        run: npm run build:win:x64
      - name: Build instalador ARM64
        run: npm run build:win:arm64
      # Un artefacto por arquitectura: x64 = PCs Intel/AMD, arm64 = Windows en ARM (Snapdragon).
      - uses: actions/upload-artifact@v4
        with:
          name: Kapta-Descargador-Windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          # El instalador ya va comprimido.
          compression-level: 0
          # Al re-ejecutar un job, reemplaza el artefacto anterior en vez de fallar.
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: Kapta-Descargador-Windows-arm64
          path: dist/*-arm64.exe
          if-no-files-found: error
          # El instalador ya va comprimido.
          compression-level: 0
          # Al re-ejecutar un job, reemplaza el artefacto anterior en vez de fallar.
          overwrite: true
